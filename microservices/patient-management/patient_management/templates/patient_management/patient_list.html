<!DOCTYPE html>
<html>
<head>
    <title>Patient List</title>
</head>
<body>
    <h1>Patient List</h1>
    <a href="{% url 'add_patient' %}">Add New Patient</a>
    <ul>
        {% for patient in patients %}
            <li><a href="{% url 'patient_detail' patient.pk %}">{{ patient.first_name }} {{ patient.last_name }}</a></li>
        {% endfor %}
    </ul>
</body>
</html>
