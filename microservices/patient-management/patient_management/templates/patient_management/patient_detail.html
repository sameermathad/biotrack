<!DOCTYPE html>
<html>
<head>
    <title>{{ patient.first_name }} {{ patient.last_name }}</title>
</head>
<body>
    <h1>{{ patient.first_name }} {{ patient.last_name }}</h1>
    <p>Date of Birth: {{ patient.date_of_birth }}</p>
    <p>Email: {{ patient.email }}</p>
    <p>Phone: {{ patient.phone_number }}</p>
    <p>Address: {{ patient.address }}</p>

    <a href="{% url 'medical_history_list' patient.pk %}">View Medical History</a>
    <a href="{% url 'add_medical_history' patient.pk %}">Add Medical History</a>
    <a href="{% url 'appointment_list' patient.pk %}">View Appointments</a>
    <a href="{% url 'add_appointment' patient.pk %}">Add Appointment</a>
</body>
</html>
